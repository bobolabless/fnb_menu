[project]
name = "fnb_menu"
authors = [
  { name = "Rhocom Technology Limited", email = "info@rhocom.com" }
]
description = "RhoHMS Food & Beverage menu add-on for digital menus, prepaid guest self-ordering and kitchen operations."
requires-python = ">=3.10,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"

[project.urls]
Homepage = "https://rhocom.com"

[tool.ruff]
line-length = 110
target-version = "py310"
